<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NKC Loading Animation Preview</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0d0f18;
    }
    .scene {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 0 1.5rem;
      background: #0d0f18;
      border-radius: 16px;
    }
    .flask-stage {
      position: relative;
      width: 260px;
      height: 380px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .fog-p {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      animation: fogUp var(--fd,4s) ease-out var(--fdelay,0s) infinite;
    }
    @keyframes fogUp {
      0%   { opacity:0; transform:translateY(0) translateX(0) scale(0.3); filter:blur(3px); }
      10%  { opacity:0.3; }
      50%  { opacity:0.15; transform:translateY(-50px) translateX(var(--fx,8px)) scale(1.6); filter:blur(7px); }
      100% { opacity:0; transform:translateY(-110px) translateX(var(--fx2,16px)) scale(2.5); filter:blur(11px); }
    }
  </style>
</head>
<body>

<div class="scene">

    <!-- Colorful Fog / vapor particles (Origin lowered to start at flask neck) -->

<script>
  const pivotX = 110, pivotY = 50;
  const orbitR = 11;
  const period = 5200;   // slower rotation (was 2800)
  let t0 = null;

  function tick(ts) {
    if (!t0) t0 = ts;
    const angle = ((ts - t0) / period) * 2 * Math.PI;

    const dx = Math.sin(angle) * orbitR;
    const dy = (1 - Math.cos(angle)) * orbitR * 0.4;
    const tilt = Math.sin(angle) * 7;  // gentler tilt (was 12)

    const g = document.getElementById('wholeFlask');
    if (g) {
      g.setAttribute('transform',
        `rotate(${tilt}, ${pivotX}, ${pivotY}) translate(${dx * 0.3}, ${dy})`
      );
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
