<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#059669" />
    <!--head-->
    <meta name="author" content="TestoZa Educational Systems" />
    <meta name="application-name" content="Panna" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Google Analytics 4. The tag (190 KB of script) loads on the visitor's first
         interaction or after 8 s, so it never competes with the page itself. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      // The app sends every page view itself (src/pdf/site/App.tsx), so the automatic
      // one on load would count each landing page twice.
      gtag('config', 'G-H9VZL1VTKL', { send_page_view: false });
      (function () {
        var done = false;
        var events = ['pointerdown', 'keydown', 'scroll', 'touchstart'];
        function load() {
          if (done) return;
          done = true;
          events.forEach(function (e) { removeEventListener(e, load); });
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-H9VZL1VTKL';
          document.head.appendChild(s);
        }
        events.forEach(function (e) { addEventListener(e, load, { once: true, passive: true }); });
        addEventListener('load', function () { setTimeout(load, 8000); });
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/pdf/site/entry-client.tsx"></script>
  </body>
</html>
