# Cloudflare Worker Configuration for TestoZa SEO
# Deploy with: wrangler deploy --env production

name = "testoza-seo-worker"
main = "worker.js"
compatibility_date = "2026-02-12"

minify = true

# Environment variables (non-sensitive)
[vars]
FRONTEND_URL = "https://testoza.com"
CACHE_TTL_SITEMAP = "3600"
CACHE_TTL_STATIC = "86400"
CACHE_TTL_HTML = "300"

# Production environment
[env.production]
# Route patterns - all requests to testoza.com, and to blog.testoza.com (the blog's own
# head, robots.txt and sitemap; the site itself is the same Pages project)
# app.testoza.com is the running application and is served by Pages — the worker is
# routed there ONLY for the three kinds of link a teacher sends to a batch, so their
# WhatsApp preview names the paper instead of advertising a test maker. See
# handleSharedLink() in worker.js; everything else on that host is untouched.
routes = [
  { pattern = "testoza.com/*", zone_name = "testoza.com" },
  { pattern = "blog.testoza.com/*", zone_name = "testoza.com" },
  { pattern = "app.testoza.com/test/*", zone_name = "testoza.com" },
  { pattern = "app.testoza.com/test-intro/*", zone_name = "testoza.com" },
  { pattern = "app.testoza.com/join/*", zone_name = "testoza.com" }
]

[env.production.vars]
API_BASE_URL = "https://apigcp.testoza.com"  # Update with your Cloud Run URL
FRONTEND_URL = "https://testoza.com"
CACHE_TTL_SITEMAP = "3600"
CACHE_TTL_STATIC = "86400"
CACHE_TTL_HTML = "300"

# Secrets (set via wrangler secret put)
# SITEMAP_INVALIDATE_SECRET
# REDIS_URL (if using Redis)

# KV Namespace for persistent caching (optional)
# [[env.production.kv_namespaces]]
# binding = "SITEMAP_CACHE"
# id = "your-kv-namespace-id"

# R2 bucket for sitemap storage (optional)
# [[env.production.r2_buckets]]
# binding = "SITEMAP_BUCKET"
# bucket_name = "testoza-sitemaps"

# Analytics
analytics_engine_datasets = [
  { binding = "SEO_ANALYTICS", dataset = "testoza-seo-metrics" }
]

# Build settings
[build]
command = ""
