<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Outfit;font-weight:500;src:url(Outfit-500.woff2)}
@font-face{font-family:Outfit;font-weight:700;src:url(Outfit-700.woff2)}
@font-face{font-family:Outfit;font-weight:900;src:url(Outfit-900.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#f1f1f1;font-family:Roboto,Arial,sans-serif;padding:40px 108px 60px;width:1500px}
h2{font:700 30px Outfit,sans-serif;margin:56px 0 18px;color:#fff}
h2:first-child{margin-top:0}
h2 small{font-weight:500;font-size:20px;color:#aaa;margin-left:14px}
.lbl{font-size:14px;color:#aaa;margin:0 0 8px;text-transform:uppercase;letter-spacing:.08em}
.crop{position:relative;overflow:hidden;border-radius:16px}
.crop img{position:absolute;display:block}
.desk{width:1284px;height:212px}
.desk img{width:1284px;left:0;top:-254.8px}
.chan{display:flex;align-items:center;gap:24px;margin-top:20px}
.av{width:120px;height:120px;border-radius:50%;background:#0b1530;display:grid;place-items:center;flex:none}
.av span{font:900 92px/1 Outfit,sans-serif;background:linear-gradient(#FFE885,#F4B838 50%,#9E6400);-webkit-background-clip:text;color:transparent;margin-top:6px}
.chan b{display:block;font-size:34px}
.chan small{color:#aaa;font-size:15px}
.below{display:flex;gap:56px;margin-top:34px;align-items:flex-start}
.phone{width:390px;background:#0f0f0f;border:10px solid #2a2a2a;border-radius:44px;padding:44px 16px 26px}
.ph{width:338px;height:92.5px;border-radius:12px}
.ph img{width:559.7px;left:-110.8px;top:-111.0px}
.phone .chan{gap:14px;margin-top:14px}
.phone .av{width:68px;height:68px}.phone .av span{font-size:52px}
.phone .chan b{font-size:22px}.phone .chan small{font-size:12px}
.tv{width:704px;height:396px;border-radius:10px}
.tv img{width:704px;left:0;top:0}
</style></head>
<body>
<div id="out"></div>
<script>
const items = [
  ['youtube-banner-a-signature', 'A · Signature', 'dark, OMR wings'],
  ['youtube-banner-b-product', 'B · Product', 'PDF → online test'],
  ['youtube-banner-c-paper', 'C · Paper', 'light, teacher red pen'],
];
const img = (n) => `<img src="../${n}.png" onerror="this.onerror=null;this.src='../${n}.jpg'">`;
const chan = '<div class="chan"><div class="av"><span>Z</span></div><div><b>TestoZa</b><small>@testozaofficial · preview avatar</small></div></div>';
out.innerHTML = items.map(([n, t, s]) => `
  <h2>${t}<small>${s}</small></h2>
  <div class="lbl">Desktop</div>
  <div class="crop desk">${img(n)}</div>${chan}
  <div class="below">
    <div><div class="lbl">Phone</div><div class="phone"><div class="crop ph">${img(n)}</div>${chan}</div></div>
    <div><div class="lbl">TV (full image)</div><div class="crop tv">${img(n)}</div></div>
  </div>`).join('');
</script>
</body></html>
