<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/thumb-base.css">
<style>
  .cbt-screen-card {
    left: 640px;
    top: 50px;
    width: 620px;
    height: 380px;
    transform: perspective(1000px) rotateY(-8deg) rotateX(4deg) rotateZ(-3deg);
    border: 3px solid rgba(56, 189, 248, 0.4);
    box-shadow: 0 35px 80px rgba(0,0,0,0.85), 0 0 50px rgba(14, 165, 233, 0.3);
  }
  .cbt-screen-card img {
    width: 620px;
    height: auto;
    display: block;
  }
  .palette-card {
    position: absolute;
    left: 810px;
    top: 260px;
    width: 440px;
    border-radius: 20px;
    overflow: hidden;
    background: #0f172a;
    border: 3.5px solid #facc15;
    box-shadow: 0 35px 70px rgba(0,0,0,0.9), 0 0 45px rgba(250, 204, 21, 0.4);
    transform: rotate(4deg);
    z-index: 20;
  }
  .palette-card img {
    width: 440px;
    display: block;
  }
  .nta-tag {
    position: absolute;
    left: 770px;
    top: 40px;
    background: #10b981;
    color: #ffffff;
    font-weight: 900;
    font-size: 28px;
    padding: 12px 24px;
    border-radius: 14px;
    transform: rotate(-5deg);
    box-shadow: 0 16px 36px rgba(16, 185, 129, 0.6);
    z-index: 25;
    border: 2px solid rgba(255, 255, 255, 0.5);
  }
  .timer-pill {
    position: absolute;
    left: 840px;
    top: 610px;
    background: #0f172a;
    border: 2px solid #38bdf8;
    color: #38bdf8;
    font-weight: 800;
    font-size: 26px;
    padding: 8px 22px;
    border-radius: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    z-index: 25;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .timer-pill span.dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ef4444;
    box-shadow: 0 0 12px #ef4444;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grid-overlay"></div>
  <img class="logo-brand" src="../assets/wordmark.png" alt="TestoZa">
  
  <div class="copy-box">
    <div class="kicker emerald">JEE · NEET · CUET</div>
    <h1 class="headline">
      NTA CBT<br>
      <span class="grad">EXAM SCREEN</span>
    </h1>
    <div class="pill-action">Bas 1 Setting! ⚡</div>
    
    <div class="sub-features">
      <div class="feat-item"><span class="icon">✓</span> Real Question Palette (Green, Purple, Orange)</div>
      <div class="feat-item"><span class="icon">✓</span> Official NTA Timer & Mark For Review</div>
      <div class="feat-item"><span class="icon">✓</span> Apne Questions ke saath Practice!</div>
    </div>
  </div>

  <div class="nta-tag">100% NTA PATTERN 🎯</div>
  <div class="ui-card cbt-screen-card">
    <img src="../assets/cbt-exam.png" alt="CBT Exam">
  </div>
  <div class="palette-card">
    <img src="../assets/cbt-palette.png" alt="Question Palette">
  </div>
  <div class="timer-pill">
    <span class="dot"></span> TIME LEFT: 02:59:45
  </div>
</div>
</body>
</html>
