<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/thumb-base.css">
<style>
  .photo-frame-card {
    position: absolute;
    left: 640px;
    top: 70px;
    width: 320px;
    height: 440px;
    background: #0f172a;
    border-radius: 18px;
    overflow: hidden;
    transform: rotate(-6deg);
    border: 3px solid #38bdf8;
    box-shadow: 0 30px 70px rgba(0,0,0,0.85), 0 0 40px rgba(56, 189, 248, 0.35);
    z-index: 10;
  }
  .photo-frame-card img {
    width: 320px;
    display: block;
  }
  .photo-badge {
    position: absolute;
    left: 645px;
    top: 35px;
    background: #facc15;
    color: #0b1120;
    font-weight: 900;
    font-size: 24px;
    padding: 8px 18px;
    border-radius: 12px;
    transform: rotate(-6deg);
    z-index: 25;
    box-shadow: 0 10px 24px rgba(250, 204, 21, 0.4);
  }
  .ready-card {
    position: absolute;
    left: 860px;
    top: 140px;
    width: 390px;
    height: 380px;
    border-radius: 20px;
    background: #0a0e1c;
    border: 3.5px solid #10b981;
    box-shadow: 0 35px 80px rgba(0,0,0,0.9), 0 0 50px rgba(16, 185, 129, 0.4);
    transform: rotate(4deg);
    overflow: hidden;
    z-index: 20;
  }
  .ready-card img {
    width: 390px;
    display: block;
  }
  .ready-badge {
    position: absolute;
    left: 920px;
    top: 90px;
    background: #10b981;
    color: #ffffff;
    font-weight: 900;
    font-size: 24px;
    padding: 8px 20px;
    border-radius: 12px;
    transform: rotate(4deg);
    z-index: 25;
    box-shadow: 0 10px 24px rgba(16, 185, 129, 0.5);
  }
  .seconds-pill {
    position: absolute;
    left: 710px;
    top: 575px;
    background: #ef4444;
    color: #ffffff;
    font-weight: 900;
    font-size: 32px;
    padding: 14px 32px;
    border-radius: 35px;
    box-shadow: 0 16px 40px rgba(239, 68, 68, 0.6);
    z-index: 25;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 2.5px solid rgba(255, 255, 255, 0.4);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grid-overlay"></div>
  <img class="logo-brand" src="../assets/wordmark.png" alt="TestoZa">
  
  <div class="copy-box">
    <div class="kicker amber">📸 CAMERA SNAP TO TEST</div>
    <h1 class="headline">
      BOOK PHOTO ➔<br>
      <span class="gold">ONLINE TEST</span>
    </h1>
    <div class="pill-action">17 Seconds Record! ⚡</div>
    
    <div class="sub-features">
      <div class="feat-item"><span class="icon">✓</span> Kitab ya Notes ki Photo kheecho</div>
      <div class="feat-item"><span class="icon">✓</span> AI khud extract karega Questions & Answers</div>
      <div class="feat-item"><span class="icon">✓</span> Students ke sath Join Code share karo!</div>
    </div>
  </div>

  <div class="photo-badge">📸 BOOK / NOTES PHOTO</div>
  <div class="photo-frame-card">
    <img src="../assets/page-1.png" alt="Book Page">
  </div>
  
  <div class="ready-badge">✅ TEST READY!</div>
  <div class="ui-card ready-card">
    <img src="../assets/run-009-17.7s.png" alt="Test Ready">
  </div>
  
  <div class="seconds-pill">
    <span>⏱️</span> SIRF 17 SECONDS MEIN! 🚀
  </div>
</div>
</body>
</html>
