<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/thumb-vertical-base.css">
<style>
  .cbt-screen {
    left: 80px;
    top: 710px;
    width: 920px;
    transform: rotate(-4deg);
    border: 3.5px solid rgba(56, 189, 248, 0.45);
    box-shadow: 0 40px 90px rgba(0,0,0,0.9), 0 0 50px rgba(14, 165, 233, 0.35);
    z-index: 10;
  }
  .palette-card {
    left: 180px;
    top: 1060px;
    width: 780px;
    transform: rotate(4deg);
    border: 4px solid #facc15;
    box-shadow: 0 45px 95px rgba(0,0,0,0.95), 0 0 55px rgba(250, 204, 21, 0.45);
    z-index: 20;
  }
  .nta-badge {
    left: 80px;
    top: 650px;
    background: #10b981;
    color: #ffffff;
    transform: rotate(-5deg);
    box-shadow: 0 16px 36px rgba(16, 185, 129, 0.7);
    border: 2px solid rgba(255, 255, 255, 0.5);
  }
  .timer-pill {
    left: 200px;
    top: 1660px;
    background: #0f172a;
    border: 3px solid #38bdf8;
    color: #38bdf8;
    font-weight: 800;
    font-size: 38px;
    padding: 16px 36px;
    border-radius: 40px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.9);
    z-index: 25;
    display: inline-flex;
    align-items: center;
    gap: 16px;
  }
  .dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ef4444;
    box-shadow: 0 0 16px #ef4444;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grid-overlay"></div>
  <img class="logo-brand" src="../assets/wordmark.png" alt="TestoZa">
  
  <div class="header-box">
    <div class="kicker emerald">JEE · NEET · CUET</div>
    <h1 class="h-main"><span class="grad">NTA CBT</span></h1>
    <h2 class="h-sub">EXAM SCREEN</h2>
    <div class="pill-action">Bas 1 Setting! ⚡</div>
  </div>

  <div class="floating-badge nta-badge">100% NTA PATTERN 🎯</div>
  
  <div class="ui-card-vertical cbt-screen">
    <img src="../assets/cbt-exam.png" alt="CBT Exam">
  </div>
  
  <div class="ui-card-vertical palette-card">
    <img src="../assets/cbt-palette.png" alt="Question Palette">
  </div>
  
  <div class="floating-badge timer-pill">
    <span class="dot"></span> TIME LEFT: 02:59:45
  </div>
</div>
</body>
</html>
