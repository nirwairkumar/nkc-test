<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/thumb-vertical-base.css">
<style>
  .warn-glow {
    position: absolute;
    left: 200px;
    top: 750px;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(239, 68, 68, 0.4) 0%, transparent 70%);
    filter: blur(60px);
    pointer-events: none;
  }
  .warn-modal {
    left: 80px;
    top: 720px;
    width: 900px;
    transform: rotate(-4deg);
    border: 3.5px solid #ef4444;
    box-shadow: 0 45px 95px rgba(0,0,0,0.95), 0 0 60px rgba(239, 68, 68, 0.45);
    z-index: 10;
  }
  .phone-proctor {
    left: 480px;
    top: 960px;
    width: 480px;
    transform: rotate(5deg);
    border: 4px solid #ef4444;
    box-shadow: 0 50px 100px rgba(0,0,0,0.95), 0 0 60px rgba(239, 68, 68, 0.5);
    z-index: 20;
  }
  .limit-badge {
    left: 80px;
    top: 650px;
    background: #facc15;
    color: #0b1120;
    transform: rotate(-4deg);
    box-shadow: 0 16px 36px rgba(250, 204, 21, 0.5);
  }
  .auto-submit-pill {
    left: 120px;
    top: 1650px;
    background: #ef4444;
    color: #ffffff;
    font-weight: 900;
    font-size: 38px;
    padding: 18px 40px;
    border-radius: 40px;
    box-shadow: 0 18px 45px rgba(239, 68, 68, 0.7);
    z-index: 25;
    display: inline-flex;
    align-items: center;
    gap: 16px;
    border: 3px solid #ffffff;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grid-overlay"></div>
  <div class="warn-glow"></div>
  <img class="logo-brand" src="../assets/wordmark.png" alt="TestoZa">
  
  <div class="header-box">
    <div class="kicker red">🚨 ANTI-CHEAT PROCTORING</div>
    <h1 class="h-main"><span class="grad">CHEATING</span></h1>
    <h2 class="h-sub"><span style="color: #ef4444;">CAUGHT! 🚫</span></h2>
    <div class="pill-action red">Tab Switch Blocked! ⚡</div>
  </div>

  <div class="floating-badge limit-badge">3 WARNINGS LIMIT ⚠️</div>
  
  <div class="ui-card-vertical warn-modal">
    <img src="../assets/cbt-warn2.png" alt="Warning alert">
  </div>
  
  <div class="phone-vertical phone-proctor">
    <div class="screen">
      <img src="../assets/phone-warning.png" alt="Student screen locked">
    </div>
  </div>
  
  <div class="floating-badge auto-submit-pill">
    <span>⚠️</span> EXAM AUTO SUBMITTED!
  </div>
</div>
</body>
</html>
