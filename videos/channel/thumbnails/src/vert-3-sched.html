<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../assets/thumb-vertical-base.css">
  <style>
      .sched-card {
        position: absolute;
        left: 80px;
        top: 720px;
        width: 920px;
        transform: rotate(-4deg);
        border: 3.5px solid rgba(56, 189, 248, 0.5);
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.95), 0 0 50px rgba(14, 165, 233, 0.35);
        z-index: 10;
      }

        .phone-waiting {
          position: absolute;
          left: 490px;
          top: 960px;
          width: 480px;
          transform: rotate(5deg);
          border: 4px solid #facc15;
          box-shadow: 0 50px 100px rgba(0, 0, 0, 0.95), 0 0 60px rgba(250, 204, 21, 0.45);
          z-index: 20;
        }

          .waiting-lbl {
            position: absolute;
            left: 540px;
            top: 900px;
            background: #10b981;
            color: #ffffff;
            transform: rotate(5deg);
            box-shadow: 0 16px 36px rgba(16, 185, 129, 0.6);
            z-index: 25;
          }

          .lock-badge {
            position: absolute;
            left: 80px;
            top: 650px;
            background: #ef4444;
            color: #ffffff;
            transform: rotate(-5deg);
            box-shadow: 0 16px 36px rgba(239, 68, 68, 0.6);
            z-index: 25;
          }

          .lock-pill {
            position: absolute;
            left: 120px;
            top: 1650px;
            background: #0f172a;
            border: 3.5px solid #ef4444;
            color: #f87171;
            font-weight: 900;
            font-size: 38px;
            padding: 18px 44px;
            border-radius: 40px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.9);
            z-index: 25;
            display: inline-flex;
            align-items: center;
            gap: 16px;
          }
  </style>
</head>

<body>
  <div class="stage">
    <div class="grid-overlay"></div>
    <img class="logo-brand" src="../assets/wordmark.png" alt="TestoZa">

    <div class="header-box">
      <div class="kicker amber">⏳ SCHEDULED ACCESS</div>
      <h1 class="h-main"><span class="grad">AUTO OPEN</span></h1>
      <h2 class="h-sub">&amp; CLOSE TIME ⏱️</h2>
      <div class="pill-action">No Late Entries! 🔒</div>
    </div>

    <div class="floating-badge lock-badge">🔒 AUTO LOCK ACCESS</div>

      <div class="ui-card-vertical sched-card">
        <img src="../assets/sched-saved.png" alt="Scheduled exam settings">
      </div>

      <div class="floating-badge waiting-lbl">⏳ WAITING ROOM COUNTDOWN</div>

        <div class="phone-vertical phone-waiting">
          <div class="screen">
            <img src="../assets/early-waiting.png" alt="Waiting room screen">
          </div>
        </div>

        <div class="floating-badge lock-pill">
          <span>🚫</span> ZERO LATE ENTRIES · AUTO CLOSE
        </div>
      </div>
</body>

</html>
