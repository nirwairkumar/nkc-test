<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/thumb-vertical-base.css">
<style>
  .paper-card {
    left: 60px;
    top: 730px;
    width: 480px;
    height: 640px;
    background: #ffffff;
    border-radius: 28px;
    overflow: hidden;
    transform: rotate(-6deg);
    border: 4px solid #ffffff;
    box-shadow: 0 40px 90px rgba(0,0,0,0.9), 0 0 50px rgba(255,255,255,0.25);
    z-index: 10;
  }
  .paper-card img {
    width: 480px;
    display: block;
  }
  .paper-lbl {
    left: 70px;
    top: 670px;
    background: #ef4444;
    color: #ffffff;
    transform: rotate(-6deg);
    box-shadow: 0 16px 36px rgba(239, 68, 68, 0.6);
  }
  .arrow-trans {
    position: absolute;
    left: 450px;
    top: 980px;
    font-size: 130px;
    color: #facc15;
    font-weight: 900;
    text-shadow: 0 0 40px rgba(250, 204, 21, 0.9);
    z-index: 30;
    transform: rotate(-5deg);
  }
  .phone-res {
    left: 520px;
    top: 860px;
    width: 480px;
    transform: rotate(5deg);
    border: 4px solid #38bdf8;
    box-shadow: 0 50px 100px rgba(0,0,0,0.95), 0 0 60px rgba(56, 189, 248, 0.45);
    z-index: 20;
  }
  .res-lbl {
    left: 660px;
    top: 800px;
    background: #10b981;
    color: #ffffff;
    transform: rotate(5deg);
    box-shadow: 0 16px 36px rgba(16, 185, 129, 0.6);
  }
  .score-pill {
    left: 120px;
    top: 1650px;
    background: #0f172a;
    border: 3.5px solid #facc15;
    color: #facc15;
    font-weight: 900;
    font-size: 38px;
    padding: 18px 44px;
    border-radius: 40px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.9);
    z-index: 25;
    display: inline-flex;
    align-items: center;
    gap: 16px;
  }
  .green { color: #34d399; }
  .red { color: #f87171; }
</style>
</head>
<body>
<div class="stage">
  <div class="grid-overlay"></div>
  <img class="logo-brand" src="../assets/wordmark.png" alt="TestoZa">
  
  <div class="header-box">
    <div class="kicker amber">📱 NEET · JEE · SSC · BOARDS</div>
    <h1 class="h-main"><span class="grad">DPP ➔ TEST</span></h1>
    <h2 class="h-sub" style="font-family: 'Mukta', sans-serif;"><span class="gold">2 मिनट में! ⚡</span></h2>
    <div class="pill-action">Paper Se Online Exam 🎯</div>
  </div>

  <div class="floating-badge paper-lbl">📄 PAPER DPP</div>
  <div class="paper-card">
    <img src="../assets/page-1.png" alt="DPP Paper">
  </div>

  <div class="arrow-trans">➔</div>

  <div class="floating-badge res-lbl">📱 ONLINE TEST</div>
  <div class="phone-vertical phone-res">
    <div class="screen">
      <img src="../assets/dump-b-result.png" alt="Online Result">
    </div>
  </div>
  
  <div class="floating-badge score-pill">
    MARKING: <span class="green">+4</span> / <span class="red">−1</span> · INSTANT RANK
  </div>
</div>
</body>
</html>
