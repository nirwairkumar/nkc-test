<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/thumb-vertical-base.css">
<style>
  .photo-card {
    left: 60px;
    top: 730px;
    width: 480px;
    height: 640px;
    background: #0f172a;
    border-radius: 28px;
    overflow: hidden;
    transform: rotate(-6deg);
    border: 4px solid #38bdf8;
    box-shadow: 0 40px 90px rgba(0,0,0,0.9), 0 0 50px rgba(56, 189, 248, 0.4);
    z-index: 10;
  }
  .photo-card img {
    width: 480px;
    display: block;
  }
  .photo-lbl {
    left: 70px;
    top: 670px;
    background: #facc15;
    color: #0b1120;
    transform: rotate(-6deg);
    box-shadow: 0 16px 36px rgba(250, 204, 21, 0.5);
  }
  .arrow-trans {
    position: absolute;
    left: 450px;
    top: 980px;
    font-size: 130px;
    color: #facc15;
    font-weight: 900;
    text-shadow: 0 0 40px rgba(250, 204, 21, 0.9);
    z-index: 30;
    transform: rotate(-5deg);
  }
  .ready-card {
    left: 500px;
    top: 860px;
    width: 520px;
    border-radius: 28px;
    background: #0b1329;
    border: 4px solid #10b981;
    box-shadow: 0 50px 100px rgba(0,0,0,0.95), 0 0 60px rgba(16, 185, 129, 0.5);
    transform: rotate(5deg);
    overflow: hidden;
    z-index: 20;
  }
  .ready-card img {
    width: 520px;
    display: block;
  }
  .ready-lbl {
    left: 620px;
    top: 800px;
    background: #10b981;
    color: #ffffff;
    transform: rotate(5deg);
    box-shadow: 0 16px 36px rgba(16, 185, 129, 0.6);
  }
  .seconds-pill {
    left: 120px;
    top: 1650px;
    background: #ef4444;
    color: #ffffff;
    font-weight: 900;
    font-size: 38px;
    padding: 18px 44px;
    border-radius: 40px;
    box-shadow: 0 18px 45px rgba(239, 68, 68, 0.7);
    z-index: 25;
    display: inline-flex;
    align-items: center;
    gap: 16px;
    border: 3px solid rgba(255, 255, 255, 0.4);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grid-overlay"></div>
  <img class="logo-brand" src="../assets/wordmark.png" alt="TestoZa">
  
  <div class="header-box">
    <div class="kicker amber">📸 CAMERA SNAP TO TEST</div>
    <h1 class="h-main"><span class="grad">PHOTO ➔ TEST</span></h1>
    <h2 class="h-sub"><span class="gold">17 SECONDS! ⚡</span></h2>
    <div class="pill-action">Kitab Ki Photo ➔ Live Test</div>
  </div>

  <div class="floating-badge photo-lbl">📸 BOOK / NOTES PHOTO</div>
  <div class="photo-card">
    <img src="../assets/page-1.png" alt="Book Page">
  </div>

  <div class="arrow-trans">➔</div>

  <div class="floating-badge ready-lbl">✅ TEST READY!</div>
  <div class="ui-card-vertical ready-card">
    <img src="../assets/run-009-17.7s.png" alt="Test Ready">
  </div>
  
  <div class="floating-badge seconds-pill">
    <span>⏱️</span> SIRF 17 SECONDS MEIN! 🚀
  </div>
</div>
</body>
</html>
