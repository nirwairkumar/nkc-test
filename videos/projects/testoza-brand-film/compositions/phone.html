<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #e9e4dc;
        }
        /* the classroom from the shot before, out of focus behind the phone */
        #ph-bg {
          position: absolute;
          left: -96px;
          top: -54px;
          width: 2112px;
          height: 1188px;
          background: url('assets/img/phone-bg.jpg') center / cover no-repeat;
        }
        #ph-device {
          position: absolute;
          left: 782px;
          top: 60px;
          width: 456px;
          height: 960px;
          padding: 14px;
          border-radius: 74px;
          background: linear-gradient(150deg, #44454a, #17171a 45%, #2b2b30);
          box-shadow: 0 60px 110px rgba(30, 24, 16, 0.38), 0 16px 34px rgba(30, 24, 16, 0.28),
            inset 0 0 0 2px rgba(255, 255, 255, 0.08);
        }
        #ph-screen {
          position: relative;
          width: 100%;
          height: 100%;
          border-radius: 60px;
          overflow: hidden;
          background: #000;
        }
        #ph-video {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #ph-island {
          position: absolute;
          top: 16px;
          left: 50%;
          width: 124px;
          height: 34px;
          margin-left: -62px;
          border-radius: 18px;
          background: #000;
        }
      </style>

      <div id="root" data-composition-id="phone" data-width="1920" data-height="1080">
        <div id="ph-bg"></div>
        <div id="ph-device" data-layout-allow-overflow>
          <div id="ph-screen">
            <video id="ph-video" class="clip" src="assets/ui/phone-warning.mp4" data-start="0" data-duration="4"
              data-track-index="0" muted playsinline></video>
            <div id="ph-island"></div>
          </div>
        </div>
      </div>

      <script>
        // The cut lands with the phone already rising into place; the recording's own
        // "Warning 1/3: Tab Switching / Navigation is not allowed!" appears about 0.9 s in.
        const tl = gsap.timeline({ paused: true });
        // then the camera leans in on the warning so it can be read (about 40 px "WARNING")
        tl.fromTo('#ph-device', { y: 140, rotation: -1.2 }, { y: 0, rotation: 0, duration: 0.8, ease: 'power3.out' }, 0)
          .fromTo('#ph-device', { scale: 1.0 }, { scale: 1.6, duration: 1.3, ease: 'power2.inOut' }, 1.0)
          .to('#ph-device', { scale: 1.64, duration: 1.7, ease: 'none' }, 2.3)
          .fromTo('#ph-bg', { scale: 1.0, x: 0 }, { scale: 1.12, x: -40, duration: 4, ease: 'none' }, 0);
        window.__timelines['phone'] = tl;
      </script>
    </template>
  </body>
</html>
