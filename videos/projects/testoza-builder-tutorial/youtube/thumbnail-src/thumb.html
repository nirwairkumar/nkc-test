<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Outfit;font-weight:600;src:url(Outfit-600.woff2)}
@font-face{font-family:Outfit;font-weight:800;src:url(Outfit-800.woff2)}
@font-face{font-family:Outfit;font-weight:900;src:url(Outfit-900.woff2)}
@font-face{font-family:Mukta;font-weight:700;src:url(Mukta-700.woff2)}
@font-face{font-family:Mukta;font-weight:800;src:url(Mukta-800.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:#0a1430;font-family:Outfit,Mukta,sans-serif}
.stage{position:relative;width:1280px;height:720px;background:radial-gradient(900px 600px at 20% 30%,#16306a 0%,#0a1430 70%)}
.her{position:absolute;right:-40px;top:0;width:620px;height:720px;background:url(presenter.png) 52% 0/auto 760px no-repeat;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 24%);mask-image:linear-gradient(90deg,transparent 0,#000 24%)}
.copy{position:absolute;left:56px;top:46px;width:760px}
.kicker{display:inline-block;background:#22d3ee;color:#06203a;font-weight:800;font-size:30px;padding:6px 18px;border-radius:10px;letter-spacing:.5px}
h1{color:#fff;font-weight:900;font-size:104px;line-height:.98;margin-top:18px;letter-spacing:-1px;text-shadow:0 6px 24px rgba(0,0,0,.45)}
h1 em{font-style:normal;color:#facc15}
.hi h1{font-family:Mukta,sans-serif;font-weight:800;font-size:100px;line-height:1.08;letter-spacing:0}
.card{position:absolute;background:#fff;border-radius:16px;box-shadow:0 22px 50px rgba(0,0,0,.55);overflow:hidden;border:4px solid #fff}
.card img{display:block}
.c1{left:40px;top:392px;width:470px;transform:rotate(-4deg)}
.c1 img{width:462px}
.c2{left:470px;top:410px;width:300px;transform:rotate(3deg)}
.c2 img{width:292px}
.tag{position:absolute;color:#fff;font-weight:800;font-size:26px;background:#ef4444;padding:4px 14px;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.t1{left:62px;top:372px;transform:rotate(-4deg)}
.t2{left:560px;top:392px;transform:rotate(3deg);background:#8b5cf6}
</style></head>
<body><div class="stage" id="s">
  <div class="her"></div>
  <div class="copy" id="copy"></div>
  <div class="card c1"><img src="maths.png"></div>
  <div class="card c2"><img src="react.png"></div>
  <div class="tag t1">JEE MATHS</div>
  <div class="tag t2">CHEMISTRY</div>
</div>
<script>
const hi = location.hash === '#hi';
document.getElementById('copy').innerHTML = hi
  ? '<span class="kicker">HINDI + ENGLISH</span><h1>पूरा JEE टेस्ट<br><em>7 मिनट में</em></h1>'
  : '<span class="kicker">HINDI + ENGLISH</span><h1>Build a JEE Test<br><em>in 7 Minutes</em></h1>';
if (hi) document.getElementById('copy').classList.add('hi');
</script>
</body></html>
