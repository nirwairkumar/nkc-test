<!doctype html>
<html><head><meta charset="utf-8">
<!-- Original NEET-style DPP booklet (no real institute). One page per render: ?p=cover|1|2|key
     and for the hook covers ?p=cover&exam=...&subj=...&topic=...&tone=... -->
<style>
  @font-face { font-family: 'Outfit'; font-weight: 800; src: url("../../assets/fonts/Outfit-800.woff2"); }
  @font-face { font-family: 'Outfit'; font-weight: 600; src: url("../../assets/fonts/Outfit-600.woff2"); }
  html, body { margin: 0; width: 1240px; height: 1754px; overflow: hidden; background: #fff; }
  .pg { position: absolute; inset: 0; box-sizing: border-box; padding: 70px 80px 90px; background: #fdfcf8; color: #161616;
    font: 29px/1.45 "Times New Roman", Georgia, serif; }
  .band { display: flex; align-items: stretch; border: 2.5px solid #1f2a44; border-radius: 6px; overflow: hidden; }
  .band .tag { background: #1f2a44; color: #fff; font: 800 44px/1 'Outfit', sans-serif; padding: 22px 30px; letter-spacing: .5px; display: flex; align-items: center; }
  .band .mid { flex: 1; padding: 14px 26px; display: flex; flex-direction: column; justify-content: center; }
  .band .mid b { font: 800 32px/1.1 'Outfit', sans-serif; color: #1f2a44; }
  .band .mid span { font: 600 21px/1.3 'Outfit', sans-serif; color: #55607a; margin-top: 4px; }
  .band .rt { border-left: 2.5px solid #1f2a44; padding: 12px 22px; font: 600 20px/1.5 'Outfit', sans-serif; color: #1f2a44; display: flex; flex-direction: column; justify-content: center; }
  .rule { font: italic 21px/1.4 "Times New Roman", serif; color: #444; margin: 16px 2px 22px; border-bottom: 1.5px solid #c9c4b6; padding-bottom: 12px; }
  .cols { column-count: 2; column-gap: 54px; column-rule: 1.5px solid #d8d3c5; }
  .q { break-inside: avoid; margin: 0 0 44px; display: grid; grid-template-columns: 50px 1fr; }
  .q .n { font: 800 22px/1 'Outfit', sans-serif; color: #fff; background: #1f2a44; width: 36px; height: 34px; border-radius: 5px; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
  .q .o { display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; row-gap: 2px; margin-top: 10px; font-size: 28px; }
  .foot { position: absolute; left: 80px; right: 80px; bottom: 40px; display: flex; justify-content: space-between; font: 600 19px/1 'Outfit', sans-serif; color: #8a8577; border-top: 1.5px solid #d8d3c5; padding-top: 14px; }
  .rough { margin-top: 20px; height: 600px; border: 2px dashed #c9c4b6; border-radius: 8px; font: 600 22px/1 'Outfit', sans-serif; color: #a8a293; padding: 22px; }
  /* answer key */
  .kt { width: 100%; border-collapse: collapse; margin-top: 26px; font: 600 30px/1 'Outfit', sans-serif; text-align: center; }
  .kt td, .kt th { border: 2px solid #1f2a44; padding: 20px 0; }
  .kt th { background: #e8ebf2; color: #1f2a44; font-weight: 800; }
  .hints { margin-top: 44px; font-size: 23px; }
  .hints h3 { font: 800 28px/1 'Outfit', sans-serif; color: #1f2a44; margin: 0 0 18px; }
  .hints p { margin: 0 0 12px; }
  /* cover */
  .cover { position: absolute; inset: 0; background: var(--tone, #1f2a44); color: #fff; font-family: 'Outfit', sans-serif; overflow: hidden; }
  .cover::before { content: ''; position: absolute; right: -260px; top: -200px; width: 900px; height: 900px; border-radius: 50%; border: 90px solid rgba(255,255,255,.07); }
  .cover::after { content: ''; position: absolute; left: -200px; bottom: -300px; width: 800px; height: 800px; border-radius: 50%; background: rgba(255,255,255,.05); }
  .cover .ex { position: absolute; left: 100px; top: 120px; font: 800 30px/1 'Outfit'; letter-spacing: 6px; padding: 16px 26px; border: 3px solid rgba(255,255,255,.8); border-radius: 8px; }
  .cover .big { position: absolute; left: 100px; top: 560px; right: 100px; }
  .cover .big small { display: block; font: 600 40px/1 'Outfit'; letter-spacing: 8px; opacity: .75; }
  .cover .big b { display: block; font: 800 150px/0.98 'Outfit'; margin-top: 26px; letter-spacing: -2px; }
  .cover .big i { display: block; font: 600 50px/1.2 'Outfit'; font-style: normal; margin-top: 40px; color: rgba(255,255,255,.85); }
  .cover .strip { position: absolute; left: 0; right: 0; bottom: 0; height: 220px; background: rgba(0,0,0,.22); display: flex; align-items: center; padding: 0 100px; gap: 60px; font: 600 34px/1 'Outfit'; }
  .cover .strip span { opacity: .9; }
  .cover .nm { position: absolute; left: 100px; right: 100px; bottom: 300px; font: 600 34px/1 'Outfit'; display: flex; gap: 20px; align-items: flex-end; }
  .cover .nm u { flex: 1; text-decoration: none; border-bottom: 3px solid rgba(255,255,255,.55); height: 34px; }
</style></head>
<body>
<div id="root"></div>
<script>
const P = new URLSearchParams(location.search);
const page = P.get('p') || '1';
const Q = [
  ['A particle moves along the x-axis as x = 2t² − 4t + 3, where x is in metres and t in seconds. Its velocity at t = 3 s is', ['4 m/s', '8 m/s', '12 m/s', '6 m/s']],
  ['A car starts from rest and accelerates uniformly at 2 m/s² for 5 s. The distance it covers in this time is', ['25 m', '10 m', '50 m', '12.5 m']],
  ['A ball is dropped from a height of 80 m. Taking g = 10 m/s², the time it takes to reach the ground is', ['2 s', '8 s', '4 s', '16 s']],
  ['A body covers the first half of a distance at 20 km/h and the second half at 30 km/h. Its average speed for the whole journey is', ['24 km/h', '25 km/h', '26 km/h', '50 km/h']],
  ['The slope of a velocity–time graph gives', ['displacement', 'speed', 'acceleration', 'distance']],
  ['A ball is thrown vertically upward at 20 m/s. Taking g = 10 m/s², the maximum height it reaches is', ['10 m', '40 m', '30 m', '20 m']],
  ['A train 150 m long moves at 54 km/h. The time it takes to cross a bridge 300 m long is', ['20 s', '30 s', '10 s', '45 s']],
  ['A body starts from rest with a uniform acceleration of 4 m/s². The distance it covers in the 3rd second is', ['10 m', '18 m', '8 m', '12 m']],
  ['The area under an acceleration–time graph gives', ['change in velocity', 'displacement', 'distance', 'acceleration']],
  ['Two cars move in the same direction at 60 km/h and 40 km/h. The velocity of the faster car relative to the slower one is', ['100 km/h', '40 km/h', '60 km/h', '20 km/h']],
  ['The velocity of a particle is v = 3t² m/s. Its acceleration at t = 2 s is', ['6 m/s²', '24 m/s²', '12 m/s²', '3 m/s²']],
  ['A stone is dropped from rest. The ratio of the distances it falls in the 1st, 2nd and 3rd seconds is', ['1 : 2 : 3', '1 : 4 : 9', '1 : 3 : 5', '1 : 1 : 1']],
];
const KEY = [2, 1, 3, 1, 3, 4, 2, 1, 1, 4, 3, 3];
const band = `<div class="band"><div class="tag">DPP 07</div><div class="mid"><b>PHYSICS · Motion in a Straight Line</b><span>NEET 2027 · Daily Practice Problems</span></div><div class="rt"><span>Time: 20 min</span><span>Marks: +4 / −1</span></div></div>`;
const qs = (from, to) => Q.slice(from, to).map(([s, o], i) => `<div class="q"><div class="n">${from + i + 1}</div><div>${s}<div class="o">${o.map((x, j) => `<span>(${j + 1}) ${x}</span>`).join('')}</div></div></div>`).join('');
const foot = (n) => `<div class="foot"><span>DPP 07 · Kinematics</span><span>Page ${n}</span></div>`;
let html = '';
if (page === 'cover') {
  const exam = P.get('exam') || 'NEET 2027', subj = P.get('subj') || 'PHYSICS', topic = P.get('topic') || 'DPP 01 – 12 · Kinematics';
  html = `<div class="cover" style="--tone:${P.get('tone') || '#1f2a44'}"><div class="ex">${exam}</div>
    <div class="big"><small>DAILY PRACTICE PROBLEMS</small><b>${subj}</b><i>${topic}</i></div>
    <div class="nm"><span>Name</span><u></u></div>
    <div class="strip"><span>Booklet 2</span><span>·</span><span>Solve daily</span></div></div>`;
} else if (page === '1') {
  html = `<div class="pg">${band}<div class="rule">Each question has four options, of which only one is correct.</div><div class="cols">${qs(0, 8)}</div>${foot(1)}</div>`;
} else if (page === '2') {
  html = `<div class="pg">${band}<div class="cols" style="margin-top:34px">${qs(8, 12)}</div><div class="rough">Space for rough work</div>${foot(2)}</div>`;
} else {
  const row = (a, b) => `<tr><th>Q.</th>${KEY.slice(a, b).map((_, i) => `<th>${a + i + 1}</th>`).join('')}</tr><tr><th>Ans.</th>${KEY.slice(a, b).map((k) => `<td>(${k})</td>`).join('')}</tr>`;
  html = `<div class="pg"><div class="band"><div class="tag">KEY</div><div class="mid"><b>ANSWER KEY · DPP 07</b><span>Physics · Motion in a Straight Line</span></div></div>
    <table class="kt">${row(0, 6)}${row(6, 12)}</table>
    <div class="hints"><h3>Hints</h3>
      <p><b>1.</b> v = dx/dt = 4t − 4 → 8 m/s</p><p><b>2.</b> s = ½at² = ½ × 2 × 25 = 25 m</p>
      <p><b>3.</b> t = √(2h/g) = √16 = 4 s</p><p><b>4.</b> v̄ = 2v₁v₂ / (v₁ + v₂) = 24 km/h</p>
      <p><b>6.</b> H = u²/2g = 400/20 = 20 m</p><p><b>7.</b> t = (150 + 300) / 15 = 30 s</p>
      <p><b>8.</b> sₙ = u + a(2n − 1)/2 = 10 m</p><p><b>11.</b> a = dv/dt = 6t = 12 m/s²</p>
    </div>${foot(3)}</div>`;
}
document.getElementById('root').innerHTML = html;
</script>
</body></html>
