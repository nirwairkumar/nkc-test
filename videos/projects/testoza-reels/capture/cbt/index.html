@font-face{font-family:'Outfit';font-weight:400 600;src:url('assets/fonts/Outfit-600.woff2') format('woff2');}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#020617}
#root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Outfit',sans-serif}

/* Backdrop for the whole film (brand sky + indigo, faint grid) */
.stage{position:absolute;inset:0;background:radial-gradient(1200px 760px at 28% 62%,rgba(14,165,233,.26),rgba(2,6,23,0) 70%),radial-gradient(1000px 640px at 80% 20%,rgba(99,102,241,.26),rgba(2,6,23,0) 70%),linear-gradient(180deg,#050b1d,#020617)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(148,163,184,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.06) 1px,transparent 1px);background-size:64px 64px}
.card{position:absolute;inset:0;overflow:hidden}

/* Desktop footage: a full-frame window (it scales up into place when its section starts).
   2304x1296 frames shown at 1536x864 CSS px; GSAP scales the cam (1.25 = full frame) and pans. */
.win{position:absolute;border-radius:30px;overflow:hidden;transform-origin:50% 50%;background:#fff;box-shadow:0 0 0 3px rgba(148,163,184,.18),0 50px 110px -30px rgba(0,0,0,.9)}
.logo{position:absolute;left:0;right:0;margin:0 auto;top:1650px;height:64px;opacity:.9}
.cam{position:absolute;left:0;top:0;width:1536px;height:864px;transform-origin:0 0;overflow:visible}
.foot{position:absolute;left:0;top:0;width:1536px;height:864px;display:block}
.ov{position:absolute;left:0;top:0;width:1536px;height:864px;pointer-events:none}
.cur{position:absolute;left:0;top:0;width:26px;height:26px;margin:-2px 0 0 -3px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));z-index:5}
.loupe{position:absolute;left:0;top:0;border-radius:14px;box-shadow:0 0 0 5px #facc15,0 0 30px 6px rgba(250,204,21,.45);z-index:6}
.rip{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid #38bdf8;background:rgba(56,189,248,.18);opacity:0;z-index:4}

/* Phone (the candidate take): 646x1398 footage at 0.7 inside a frame, centred */
.phonescene{position:absolute;inset:0}
.phonescene .glow{position:absolute;left:90px;top:200px;width:900px;height:1500px;border-radius:50%;background:radial-gradient(closest-side,rgba(56,189,248,.28),rgba(56,189,248,0));filter:blur(10px)}
.pcam{position:absolute;inset:0;transform-origin:0 0}
.phone{position:absolute;padding:16px;border-radius:84px;background:#0b0f19;box-shadow:0 0 0 3px #1e293b,0 60px 120px -30px rgba(0,0,0,.9),inset 0 0 0 2px #334155}
.screen{position:relative;border-radius:68px;overflow:hidden;background:#fff}
.pv{position:absolute;left:0;top:0;width:100%;height:100%}
.pvid{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.chrome{position:absolute;left:0;right:0;top:0;height:219px;background:#f8fafc;border-bottom:1px solid #e2e8f0;z-index:3;opacity:0}
.tbar{position:absolute;left:0;right:0;bottom:0;height:97px;background:#f8fafc;border-top:1px solid #e2e8f0;z-index:3;display:flex;justify-content:space-around;align-items:center;padding:0 26px 10px;opacity:0}
.tbar i{width:22px;height:22px;border-radius:6px;border:2.5px solid #64748b;display:block}
.tbar i:nth-child(3){border-radius:50%}
.sbar{position:absolute;left:0;right:0;top:0;height:84px;display:flex;align-items:center;justify-content:space-between;padding:10px 60px 0 68px;font:700 26px 'Outfit';color:#0f172a}
.isl{position:absolute;left:50%;top:20px;width:190px;height:52px;margin-left:-95px;border-radius:20px;background:#000;display:block}
.sig{display:flex;align-items:flex-end;gap:2px}
.sig b{width:4px;background:currentColor;border-radius:1px;display:block}
.sig b:nth-child(1){height:5px}.sig b:nth-child(2){height:8px}.sig b:nth-child(3){height:11px}.sig b:nth-child(4){height:14px}
.sig em{width:25px;height:12px;border:2px solid currentColor;border-radius:4px;margin-left:8px;display:block;position:relative}
.sig em::after{content:'';position:absolute;left:1px;top:1px;width:16px;height:6px;background:currentColor;border-radius:1px}
.purl{position:absolute;left:28px;right:28px;top:110px;height:74px;border-radius:37px;background:#e9eef5;display:flex;align-items:center;justify-content:center;gap:12px;font:600 28px 'Outfit';color:#1e293b}
.purl .lk{width:15px;height:15px;color:#475569;display:block}
.purl .lk svg{width:15px;height:15px;display:block}
.purl .u2{display:none}


/* Fast-forward pill (a wait shown faster): an icon and the speed, no words */
.speed{position:absolute;right:56px;top:150px;height:64px;display:flex;align-items:center;gap:12px;padding:0 26px 0 22px;border-radius:999px;background:rgba(2,6,23,.88);box-shadow:0 0 0 2px rgba(250,204,21,.7);color:#facc15;z-index:9}
.speed i{width:30px;height:30px;display:block}
.speed i svg{width:30px;height:30px;display:block}
.speed b{font:800 30px 'Outfit'}


/* End card: logo, testoza.com, a bell (no words) */
.endcard{background:radial-gradient(900px 600px at 50% 50%,rgba(56,189,248,.18),rgba(2,6,23,0) 70%)}
.endcard .wm{position:absolute;left:0;right:0;margin:0 auto;top:760px;height:150px}
.pills{position:absolute;left:0;right:0;top:990px;display:flex;justify-content:center;gap:28px}
.pill{height:92px;padding:0 48px;border-radius:999px;display:flex;align-items:center;gap:14px;font:700 42px 'Outfit'}
.pill.url{color:#f8fafc;background:rgba(15,23,42,.7);box-shadow:0 0 0 2px rgba(56,189,248,.65)}
.pill.subs{padding:0 34px;color:#fff;background:#dc2626;box-shadow:0 20px 40px -14px rgba(220,38,38,.7)}
.bell{width:30px;height:30px;border-radius:15px 15px 5px 5px;background:#fff;display:block;position:relative}
.bell::after{content:'';position:absolute;left:11px;bottom:-7px;width:8px;height:7px;border-radius:0 0 4px 4px;background:#fff}

      const el = q(p.sel);
      tl.fromTo(el, { scale: 0.92, y: 40, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: 'power3.out', immediateRender: false }, p.at);
    }
    if (p.type === 'shot') {
      const el = q(p.sel);
      tl.set(el, { transformOrigin: p.from.x === 0 && p.from.y !== undefined && p.sel.startsWith('#mt') && q(p.sel).classList.contains('pcam') ? '50% 50%' : '0 0' }, 0);
      tl.fromTo(el, p.from, { ...p.to, duration: p.dur, ease: 'sine.inOut', immediateRender: false }, p.at);
    }
    if (p.type === 'cursor') {
      // Glides between recorded points; a ripple on every click.
      const cur = q(p.cur), rip = q(p.rip);
      tl.set(cur, { x: p.moves[0].x, y: p.moves[0].y, opacity: 1 }, 0);
      tl.set(rip, { opacity: 0 }, 0);
      let prev = p.moves[0];
      for (const m of p.moves.slice(1)) {
        if (m.x !== prev.x || m.y !== prev.y) tl.fromTo(cur, { x: prev.x, y: prev.y }, { x: m.x, y: m.y, duration: m.d, ease: 'power2.inOut', immediateRender: false }, m.at - m.d);
        if (m.click) tl.fromTo(rip, { x: m.x, y: m.y, scale: 0.5, opacity: 0.95 }, { x: m.x, y: m.y, scale: 1.9, opacity: 0, duration: 0.5, ease: 'power2.out', immediateRender: false }, m.at);
        prev = m;
      }
      for (const [a, b] of p.hides) { fade(cur, a, 1, 0, 0.15); fade(cur, b, 0, 1, 0.15); }
    }
    if (p.type === 'phone') {
      const scene = q(p.sel), cam = q(p.sel + '-cam'), pv = q(p.sel + '-pv'), chrome = q(p.sel + '-chrome'), tbar = q(p.sel + '-tbar');
      // Browser bars while the page is not full screen; the page lifts above the bottom toolbar.
      tl.set([chrome, tbar], { opacity: 0 }, 0);
      tl.set(pv, { y: 0 }, 0);
      for (const [a, b] of p.wins) {
        tl.set([chrome, tbar], { opacity: 1 }, a);
        tl.set(pv, { y: -p.lift }, a);
        if (b < p.end - 0.01) { tl.set([chrome, tbar], { opacity: 0 }, b); tl.set(pv, { y: 0 }, b); }
      }
      tl.set(q('.u1', scene), { display: 'inline' }, 0);
      tl.set(q('.u2', scene), { display: 'none' }, 0);
      tl.set(q('.u1', scene), { display: 'none' }, p.urlAt);
      tl.set(q('.u2', scene), { display: 'inline' }, p.urlAt);
      // Punch-ins on the moments that matter, then back out.
      tl.set(cam, { transformOrigin: '0 0', scale: 1, x: 0, y: 0 }, 0);
      for (const z of p.zooms) {
        const x = Math.max(1920 * (1 - z.z), Math.min(0, z.cx * (1 - z.z) + (960 - z.cx) * 0.55));
        const y = Math.max(1080 * (1 - z.z), Math.min(0, z.cy * (1 - z.z) + (540 - z.cy) * 0.55));
        tl.fromTo(cam, { scale: 1, x: 0, y: 0 }, { scale: z.z, x, y, duration: 0.6, ease: 'power2.inOut', immediateRender: false }, z.at);
        tl.fromTo(cam, { scale: z.z, x, y }, { scale: 1, x: 0, y: 0, duration: 0.6, ease: 'power2.inOut', immediateRender: false }, z.at + 0.6 + z.hold);
      }
    }
    if (p.type === 'fdlg') {
      // Open box: in, cursor to the file, select, cursor to Open, click, out.
      const el = q(p.sel), cur = q('.fcur', el), tile = q('.tile.pick', el), win = q('.fwin', el);
      tl.set(el, { opacity: 0 }, 0);
      tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.18, immediateRender: false }, p.start);
      tl.fromTo(win, { scale: 0.96, y: 18 }, { scale: 1, y: 0, duration: 0.3, ease: 'power3.out', immediateRender: false }, p.start);
      tl.set(tile, { className: 'tile pick' }, 0);
      tl.fromTo(cur, { x: p.c0.x, y: p.c0.y }, { x: p.c1.x, y: p.c1.y, duration: p.g1, ease: 'power2.inOut', immediateRender: false }, p.start + 0.15);
      tl.set(tile, { className: 'tile pick sel' }, p.pickAt);
      tl.set(q('.fname em', el), { opacity: 0 }, 0);
      tl.set(q('.fname em', el), { opacity: 1 }, p.pickAt);
      tl.fromTo(cur, { x: p.c1.x, y: p.c1.y }, { x: p.c2.x, y: p.c2.y, duration: p.g2, ease: 'power2.inOut', immediateRender: false }, p.pickAt + 0.12);
      tl.fromTo(q('.btn.open', el), { scale: 1 }, { scale: 0.94, duration: 0.08, yoyo: true, repeat: 1, immediateRender: false }, p.openAt);
      tl.fromTo(el, { opacity: 1 }, { opacity: 0, duration: 0.18, immediateRender: false }, p.end - 0.18);
    }
    if (p.type === 'speed') pop(q(p.sel), p.at, { x: 30, opacity: 0 });
    if (p.type === 'title') {
      const el = q(p.sel);
      tl.fromTo(q('.wm', el), { y: 40, opacity: 0, filter: 'blur(14px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.8, ease: 'expo.out', immediateRender: false }, p.at + 0.05);
      tl.fromTo(q('.ten span', el), { scale: 0.55, opacity: 0, filter: 'blur(24px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.9, ease: 'expo.out', immediateRender: false }, p.at + 0.25);
      qa('.dots i', el).forEach((d, i) => tl.fromTo(d, { scale: 0.3, opacity: 0, backgroundColor: 'rgba(148,163,184,.25)' }, { scale: 1, opacity: 1, backgroundColor: '#38bdf8', duration: 0.3, ease: 'back.out(2)', immediateRender: false }, p.at + 0.8 + i * 0.09));
    }
    if (p.type === 'sting') {
      const el = q(p.sel), num = q('.num span', el), on = q('.dots i.on', el);
      tl.fromTo(num, { y: 140, scale: 0.7, opacity: 0, filter: 'blur(22px)' }, { y: 0, scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.6, ease: 'expo.out', immediateRender: false }, p.at + 0.02);
      tl.fromTo(q('.dots', el), { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out', immediateRender: false }, p.at + 0.15);
      tl.fromTo(on, { scale: 0.4 }, { scale: 1.25, duration: 0.35, ease: 'back.out(3)', immediateRender: false }, p.at + 0.4);
      tl.fromTo(num, { scale: 1 }, { scale: 1.04, duration: p.end - p.at - 0.9, ease: 'sine.inOut', immediateRender: false }, p.at + 0.62);
      tl.fromTo(el, { opacity: 1 }, { opacity: 0, duration: 0.28, ease: 'power1.in', immediateRender: false }, p.end - 0.28);
    }
    if (p.type === 'end') {
      const sc = q('#end');
      tl.fromTo(q('.wm', sc), { y: 50, opacity: 0, filter: 'blur(14px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.9, ease: 'expo.out', immediateRender: false }, p.at + 0.2);
      pop(q('.pills', sc), p.endurl - 0.1, { y: 30, opacity: 0 });
      tl.fromTo('#subpill', { scale: 1 }, { scale: 1.12, duration: 0.35, yoyo: true, repeat: 3, ease: 'sine.inOut', immediateRender: false }, p.endurl + 0.9);
    }
  }
  window.__timelines = window.__timelines || {};
  window.__timelines['main'] = tl;
});
